name: Create Demo Environment
run-name: Demo Environment for ${{ github.event.inputs.name }}

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Username'
        required: true

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-east-1
  KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
  ECR_REPOSITORY: ld-demo-togglewear
  KUBECTL_VERSION: "v1.23.0"
  # The person the demo belongs to. Kept apart from the namespace, which now
  # carries a suffix, because the owner's email is built from it.
  DEMO_USER: ${{ github.event.inputs.name }}
  # Suffixed so a ToggleWear demo and the same person's ToggleBank demo
  # (namespace <name>, project <name>-ld-demo) never share a namespace, a
  # subdomain or a LaunchDarkly project. Deleting one would delete the other.
  # The userKey sent to the demo portal's Lambda below carries the same
  # suffix: ToggleBank's portal pages read the newest record for <name>.
  DEMO_NAMESPACE: ${{ github.event.inputs.name }}-togglewear
  LD_PROJECT_KEY: ${{ github.event.inputs.name }}-togglewear
  LD_API_KEY: ${{ secrets.LD_EAP_API_KEY }}
  EKS_POD_IDENTITY_ROLE_ARN: ${{ secrets.EKS_POD_IDENTITY_ROLE_ARN }}

jobs:

  authorize:
    uses: ./.github/workflows/authorize.yaml
    with:
      name: ${{ inputs.name }}

  create-workflow-record:
    runs-on: ubuntu-latest
    needs: [authorize]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create Workflow Record in Database
        env:
          WORKFLOW_LAMBDA_FUNCTION_ARN: ${{ secrets.WORKFLOW_LAMBDA_FUNCTION_ARN }}
        run: |
          echo "Creating workflow record via Lambda function..."
          echo "User: $DEMO_USER"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Workflow Type: create"
          
          # Create the workflow record using AWS Lambda invoke
          # This will directly invoke the Lambda function and write to the database
          # Built with jq from environment variables, so the name can only ever
          # be a value in the JSON, never part of the command.
          PAYLOAD=$(jq -cn --arg userKey "$DEMO_NAMESPACE" --arg runId "$GITHUB_RUN_ID" --arg workflowType "create" --arg status "pending" --arg eventType "workflow_started" --arg emailPrefix "$DEMO_USER" \
            '{body: ({userKey: $userKey, runId: $runId, workflowType: $workflowType, status: $status, eventType: $eventType, emailPrefix: $emailPrefix} | tojson)}')
          aws lambda invoke \
            --function-name "$WORKFLOW_LAMBDA_FUNCTION_ARN" \
            --payload "$PAYLOAD" \
            --cli-binary-format raw-in-base64-out \
            /tmp/lambda-response.json || echo "Failed to create workflow record, continuing anyway..."
          
          echo "Workflow record creation attempted"

  provisioning_demo_environment:
    runs-on: ubuntu-latest
    needs: [create-workflow-record]
    outputs:
      check: ${{ steps.check.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up kubectl
        uses: ./.github/actions/setup-kubectl

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          # 3.10 or newer, or the observability plugin in requirements.txt will
          # not install and provisioned demos lose their errors, logs and traces.
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./.github/workflows/demo_provisioning_scripts/requirements.txt

      - name: Update Workflow Record Status to In Progress
        env:
          WORKFLOW_LAMBDA_FUNCTION_ARN: ${{ secrets.WORKFLOW_LAMBDA_FUNCTION_ARN }}
        run: |
          echo "Updating workflow record status to in_progress..."
          
          # Update the workflow record using awscurl with IAM authentication
          # Built with jq from environment variables, so the name can only ever
          # be a value in the JSON, never part of the command.
          PAYLOAD=$(jq -cn --arg userKey "$DEMO_NAMESPACE" --arg runId "$GITHUB_RUN_ID" --arg workflowType "create" --arg status "in_progress" --arg eventType "workflow_started" --arg emailPrefix "$DEMO_USER" \
            '{body: ({userKey: $userKey, runId: $runId, workflowType: $workflowType, status: $status, eventType: $eventType, emailPrefix: $emailPrefix} | tojson)}')
          aws lambda invoke \
            --function-name "$WORKFLOW_LAMBDA_FUNCTION_ARN" \
            --payload "$PAYLOAD" \
            --cli-binary-format raw-in-base64-out \
            /tmp/lambda-response.json || echo "Failed to update workflow record, continuing anyway..."

      - name: Create / Setup LaunchDarkly Project
        id: ld_project_setup
        run: |
          echo "Creating and Setting up LaunchDarkly project for namespace: $DEMO_NAMESPACE"
          python ./.github/workflows/demo_provisioning_scripts/DemoBuilder.py

      # The key the browser sends with every call to the store's AI and demo
      # routes (lib/apiGuard.ts). One per store, made here, kept only in the
      # pod's Secret below. Masked because the Actions log is public.
      - name: Make the store's demo key
        run: |
          DEMO_API_SECRET=$(openssl rand -hex 24)
          echo "::add-mask::$DEMO_API_SECRET"
          echo "DEMO_API_SECRET=$DEMO_API_SECRET" >> "$GITHUB_ENV"

      # Before the build rather than just before the deploy: EKS takes a few
      # seconds to apply a new association, and a pod started before then
      # comes up with no AWS credentials, so every Bedrock call fails.
      - name: Create EKS Pod Identity Association
        run: |
          echo "Creating Pod Identity Association for namespace: $DEMO_NAMESPACE"
          aws eks create-pod-identity-association \
            --cluster-name ld-core-demo-eks \
            --namespace "$DEMO_NAMESPACE" \
            --service-account ld-demo-togglewear-sa \
            --role-arn "$EKS_POD_IDENTITY_ROLE_ARN" \
            --region us-east-1 || echo "Pod Identity Association may already exist, continuing..."

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ld-demo-togglewear
        # The client-side ID is the one thing the build takes: the browser
        # bundle inlines it, and it is public by design. The server's keys
        # never go in; the pod gets them from its Secret.
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$DEMO_NAMESPACE-$GITHUB_RUN_ID"
          docker build --build-arg NEXT_PUBLIC_LD_CLIENT_KEY="$LD_CLIENT_KEY" -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Update K8s Deploy File
        run: python ./.github/workflows/update_k8s_deploy_file.py
        env:
          NAMESPACE: ${{ env.DEMO_NAMESPACE }}
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/ld-demo-togglewear:${{ env.DEMO_NAMESPACE }}-${{ github.run_id }}

      - name: Create the namespace in Kubernetes
        run: kubectl get namespace "$DEMO_NAMESPACE" &>/dev/null || kubectl create namespace "$DEMO_NAMESPACE"

      # Before the deploy file, which the pod cannot start without. Written
      # from environment variables, so no key is ever in the printed command.
      - name: Write the store's Secret
        run: |
          kubectl create secret generic ld-demo-togglewear-secrets -n "$DEMO_NAMESPACE" \
            --from-literal=LD_SDK_KEY="$LD_SDK_KEY" \
            --from-literal=LD_RESET_TOKEN="$LD_RESET_TOKEN" \
            --from-literal=DEMO_API_SECRET="$DEMO_API_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Applying deploy file to Kubernetes
        run: kubectl apply -f ./.github/workflows/deploy_files/deploy.yaml -n "$DEMO_NAMESPACE"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get NGINX Ingress Controller Load Balancer IP
        id: get-nginx-lb
        run: kubectl get service -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' > hostname.txt && echo "NGINX_LB_HOSTNAME=$(cat hostname.txt)" >> $GITHUB_ENV

      - name: Refresh Route 53 CNAME Record for NGINX Ingress
        run: |
          echo "Fetching Hosted Zone ID for $ROOT_DOMAIN"
          HOSTED_ZONE_ID=$(aws route53 list-hosted-zones-by-name \
            --dns-name "$ROOT_DOMAIN." \
            --query "HostedZones[0].Id" \
            --output text)

          RECORD_NAME="$DEMO_NAMESPACE.$ROOT_DOMAIN"
          echo "Looking for existing record: $RECORD_NAME"

          # Fetch matching records
          MATCHED=$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --query "ResourceRecordSets[?Name == '$RECORD_NAME.']" \
            --output json)

          # Delete if found
          if [[ "$MATCHED" != "[]" ]]; then
            echo "Deleting existing records for $RECORD_NAME..."
            echo "$MATCHED" | jq -c '.[]' | while read -r record; do
              # Wrap in full change batch
              echo "{
                \"Comment\": \"Deleting old record\",
                \"Changes\": [
                  {
                    \"Action\": \"DELETE\",
                    \"ResourceRecordSet\": $record
                  }
                ]
              }" > delete-record.json

              aws route53 change-resource-record-sets \
                --hosted-zone-id "$HOSTED_ZONE_ID" \
                --change-batch file://delete-record.json
            done
          else
            echo "No existing record found for $RECORD_NAME."
          fi

          echo "Creating CNAME record for $RECORD_NAME → $NGINX_LB_HOSTNAME"

          echo "{
            \"Comment\": \"Create CNAME for NGINX Ingress\",
            \"Changes\": [
              {
                \"Action\": \"UPSERT\",
                \"ResourceRecordSet\": {
                  \"Name\": \"$RECORD_NAME\",
                  \"Type\": \"CNAME\",
                  \"TTL\": 300,
                  \"ResourceRecords\": [
                    {
                      \"Value\": \"$NGINX_LB_HOSTNAME\"
                    }
                  ]
                }
              }
            ]
          }" > create-record.json

          aws route53 change-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --change-batch file://create-record.json
        env:
          AWS_REGION: us-east-1
          ROOT_DOMAIN: launchdarklydemos.com

      - name: Delete the deploy file
        run: rm -rf ./.github/workflows/deploy_files

      # Fills in each flag's Code references tab. A repository name per user,
      # because every upload replaces whatever was under its name: shared, it
      # would keep only whoever ran last. .launchdarkly/coderefs.yaml and
      # .ldignore shape what it finds. A hiccup here never fails the build.
      - name: Add code references
        uses: launchdarkly/find-code-references@v2.18.4
        continue-on-error: true
        with:
          accessToken: ${{ env.LD_API_KEY }}
          projKey: ${{ env.LD_PROJECT_KEY }}
          repoName: ld-demo-togglewear-${{ env.DEMO_USER }}
          lookback: 0
          ignoreServiceErrors: true

      # Until cert-manager has the store's Let's Encrypt certificate, the
      # ingress serves its built-in fake one and browsers warn, so the build
      # waits for it before the Demo Hub and Slack say ready. It usually takes
      # about five minutes. A certificate that never comes, for example past
      # Let's Encrypt's weekly limit for one hostname, never fails the build.
      # ingress-shim names the Certificate after deploy.yaml's TLS secret.
      - name: Wait for the store's certificate
        run: |
          CERT="$DEMO_NAMESPACE-tls-secret"
          kubectl rollout status deployment/ld-demo-togglewear-deployment -n "$DEMO_NAMESPACE" --timeout=5m \
            || echo "::warning::The store's pod isn't ready yet."
          for _ in $(seq 30); do
            kubectl get certificate "$CERT" -n "$DEMO_NAMESPACE" >/dev/null 2>&1 && break
            sleep 2
          done
          if kubectl wait --for=condition=Ready "certificate/$CERT" -n "$DEMO_NAMESPACE" --timeout=10m; then
            echo "The store's certificate is ready."
          else
            kubectl describe certificate "$CERT" -n "$DEMO_NAMESPACE" || true
            echo "::warning::The store's certificate isn't ready, so browsers will warn until it is."
          fi

      # Last, so a missing piece never keeps the store offline. The
      # provisioning app finds this step by its name; rename both together.
      - name: Check everything was built
        id: check
        run: python ./.github/workflows/demo_provisioning_scripts/check_build.py

  update-workflow-record-success:
    runs-on: ubuntu-latest
    needs: [provisioning_demo_environment]
    if: ${{ always() && needs.provisioning_demo_environment.result == 'success' }}
    steps:
      - name: Update Workflow Record Status to Completed
        env:
          WORKFLOW_LAMBDA_FUNCTION_ARN: ${{ secrets.WORKFLOW_LAMBDA_FUNCTION_ARN }}
        run: |
          echo "Updating workflow record status to completed..."
          
          # Update the workflow record using Lambda function
          # Built with jq from environment variables, so the name can only ever
          # be a value in the JSON, never part of the command.
          PAYLOAD=$(jq -cn --arg userKey "$DEMO_NAMESPACE" --arg runId "$GITHUB_RUN_ID" --arg workflowType "create" --arg status "completed" --arg eventType "workflow_completed" --arg conclusion "success" --arg emailPrefix "$DEMO_USER" \
            '{body: ({userKey: $userKey, runId: $runId, workflowType: $workflowType, status: $status, eventType: $eventType, conclusion: $conclusion, emailPrefix: $emailPrefix} | tojson)}')
          aws lambda invoke \
            --function-name "$WORKFLOW_LAMBDA_FUNCTION_ARN" \
            --payload "$PAYLOAD" \
            --cli-binary-format raw-in-base64-out \
            /tmp/lambda-response.json || echo "Failed to update workflow record, continuing anyway..."

  update-workflow-record-failure:
    runs-on: ubuntu-latest
    needs: [provisioning_demo_environment]
    if: ${{ always() && needs.provisioning_demo_environment.result == 'failure' }}
    steps:
      - name: Update Workflow Record Status to Failed
        env:
          WORKFLOW_LAMBDA_FUNCTION_ARN: ${{ secrets.WORKFLOW_LAMBDA_FUNCTION_ARN }}
        run: |
          echo "Updating workflow record status to failed..."
          
          # Update the workflow record using Lambda function
          # Built with jq from environment variables, so the name can only ever
          # be a value in the JSON, never part of the command.
          PAYLOAD=$(jq -cn --arg userKey "$DEMO_NAMESPACE" --arg runId "$GITHUB_RUN_ID" --arg workflowType "create" --arg status "failed" --arg eventType "workflow_failed" --arg conclusion "failure" --arg emailPrefix "$DEMO_USER" \
            '{body: ({userKey: $userKey, runId: $runId, workflowType: $workflowType, status: $status, eventType: $eventType, conclusion: $conclusion, emailPrefix: $emailPrefix} | tojson)}')
          aws lambda invoke \
            --function-name "$WORKFLOW_LAMBDA_FUNCTION_ARN" \
            --payload "$PAYLOAD" \
            --cli-binary-format raw-in-base64-out \
            /tmp/lambda-response.json || echo "Failed to update workflow record, continuing anyway..."

  # DMs the owner from the ToggleWear Slack app, so nobody has to keep the
  # Demo Hub open to find out. Runs after a failure too; not after a cancel,
  # which someone chose. The provisioning app leaves this job out of its
  # progress bar by its name; rename both together.
  notify-owner:
    runs-on: ubuntu-latest
    needs: [authorize, provisioning_demo_environment]
    # Not after a run the check refused, or it would tell the person named
    # that their build failed.
    if: ${{ !cancelled() && needs.authorize.result == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Tell the owner in Slack
        run: python3 ./.github/workflows/demo_provisioning_scripts/notify_slack.py
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          BUILD: create
          RESULT: ${{ needs.provisioning_demo_environment.result }}
          CHECK: ${{ needs.provisioning_demo_environment.outputs.check }}
