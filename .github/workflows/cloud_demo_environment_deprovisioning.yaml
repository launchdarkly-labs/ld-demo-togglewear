name: Delete Demo Environment
run-name: Delete Environment for ${{ github.event.inputs.name }}

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'User alias or LD env key'
        required: true
      webhook_url:
        description: 'Webhook URL to notify when workflow starts'
        required: false
        type: string
      webhook_id:
        description: 'Webhook ID for tracking'
        required: false
        type: string

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-east-1
  KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
  ECR_REPOSITORY: ld-demo-togglewear
  KUBECTL_VERSION: "v1.23.0"
  # Must match the create workflow exactly. These are what gets deleted, and
  # the unsuffixed names belong to the same person's ToggleBank demo.
  DEMO_NAMESPACE: ${{ github.event.inputs.name }}-togglewear
  LD_PROJECT_KEY: ${{ github.event.inputs.name }}-togglewear

jobs:
  authorize:
    uses: ./.github/workflows/authorize.yaml
    with:
      name: ${{ inputs.name }}

  notify-start:
    runs-on: ubuntu-latest
    needs: [authorize]
    if: ${{ inputs.webhook_url != '' && inputs.webhook_id != '' }}
    steps:
      # The webhook URL is read from the event file and masked, never put in an
      # expression: GitHub fills expressions into the script it prints to this
      # public log, and inputs are not masked the way secrets are. The other
      # inputs reach the script only as environment variables, and the body
      # is built with jq, so whatever was typed can only be a value in it.
      - name: Notify Workflow Started
        env:
          WEBHOOK_ID: ${{ inputs.webhook_id }}
          DEMO_USER: ${{ inputs.name }}
        run: |
          WEBHOOK_URL=$(jq -r '.inputs.webhook_url' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$WEBHOOK_URL"
          echo "Notifying webhook of delete workflow start..."
          echo "Webhook ID: $WEBHOOK_ID"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Environment: $DEMO_USER"

          BODY=$(jq -cn --arg run_id "$GITHUB_RUN_ID" --arg webhook_id "$WEBHOOK_ID" \
            --arg email_prefix "$DEMO_USER" --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{event: "workflow_started", run_id: $run_id, workflow_type: "delete", status: "in_progress",
              webhook_id: $webhook_id, email_prefix: $email_prefix, timestamp: $timestamp}')
          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions" \
            -d "$BODY" || echo "Webhook notification failed, continuing anyway..."

  delete-demo-environment: 
    runs-on: ubuntu-latest
    needs: [authorize]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up kubectl
        uses: ./.github/actions/setup-kubectl

      - name: Install LaunchDarkly CLI
        run: npm install -g @launchdarkly/ldcli
      
      - name: Set LaunchDarkly Demo Engineering Account CLI Config
        run: |
          echo "Setting up LaunchDarkly CLI for Demo Engineering Account"
          ldcli config --set access-token "$LD_API_KEY"
      
      - name: Remove Demo Environment from Demo Engineering Account for ${{ env.DEMO_NAMESPACE }}
        run: |
          ldcli projects delete --project "$LD_PROJECT_KEY"

      # Tokens belong to the account rather than the project, so deleting the
      # project leaves the store's reset key behind. Found by the name
      # DemoBuilder gives it (reset_token_name in LDPlatform.py).
      - name: Delete the store's reset key
        # Even when the project was already gone.
        if: ${{ !cancelled() }}
        env:
          LD_API_KEY: ${{ secrets.LD_EAP_API_KEY }}
          TOKEN_NAME: togglewear-reset-${{ env.LD_PROJECT_KEY }}
        run: |
          OFFSET=0
          while :; do
            PAGE=$(curl -sf -H "Authorization: $LD_API_KEY" -H "LD-API-Version: 20240415" \
              "https://app.launchdarkly.com/api/v2/tokens?showAll=true&limit=100&offset=$OFFSET") \
              || { echo "Could not list tokens, leaving the reset key"; break; }
            for ID in $(echo "$PAGE" | jq -r --arg name "$TOKEN_NAME" '.items[] | select(.name == $name) | ._id'); do
              curl -sf -X DELETE -H "Authorization: $LD_API_KEY" -H "LD-API-Version: 20240415" \
                "https://app.launchdarkly.com/api/v2/tokens/$ID" && echo "Deleted the reset key"
            done
            [ "$(echo "$PAGE" | jq '.items | length')" -lt 100 ] && break
            OFFSET=$((OFFSET + 100))
          done

      # Code references repositories also belong to the account. Each user
      # has their own, named as in the Add code references build step.
      - name: Delete the store's code references
        if: ${{ !cancelled() }}
        env:
          LD_API_KEY: ${{ secrets.LD_EAP_API_KEY }}
          REPO_NAME: ld-demo-togglewear-${{ github.event.inputs.name }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: $LD_API_KEY" -H "LD-API-Version: 20240415" \
            "https://app.launchdarkly.com/api/v2/code-refs/repositories/$REPO_NAME")
          case "$STATUS" in
            204) echo "Deleted the code references" ;;
            404) echo "No code references to delete" ;;
            *) echo "Could not delete the code references (HTTP $STATUS), leaving them" ;;
          esac

      - name: Delete Kubernetes Namespace
        run: |
          if kubectl get namespace "$DEMO_NAMESPACE" &>/dev/null; then
            kubectl delete namespace "$DEMO_NAMESPACE"
          else
            echo "No namespace $DEMO_NAMESPACE to delete"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Delete any existing Route53 records
        run: |
          echo "Fetching Hosted Zone ID for $ROOT_DOMAIN"
          HOSTED_ZONE_ID=$(aws route53 list-hosted-zones-by-name \
            --dns-name "$ROOT_DOMAIN." \
            --query "HostedZones[0].Id" \
            --output text)

          RECORD_NAME="$DEMO_NAMESPACE.$ROOT_DOMAIN"
          echo "Looking for existing record: $RECORD_NAME"

          # Fetch matching records
          MATCHED=$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --query "ResourceRecordSets[?Name == '$RECORD_NAME.']" \
            --output json)

          # Delete if found
          if [[ "$MATCHED" != "[]" ]]; then
            echo "Deleting existing records for $RECORD_NAME..."
            echo "$MATCHED" | jq -c '.[]' | while read -r record; do
              # Wrap in full change batch
              echo "{
                \"Comment\": \"Deleting old record\",
                \"Changes\": [
                  {
                    \"Action\": \"DELETE\",
                    \"ResourceRecordSet\": $record
                  }
                ]
              }" > delete-record.json

              aws route53 change-resource-record-sets \
                --hosted-zone-id "$HOSTED_ZONE_ID" \
                --change-batch file://delete-record.json
            done
          else
            echo "No existing record found for $RECORD_NAME."
          fi
        env:
          AWS_REGION: 'us-east-1'
          ROOT_DOMAIN: launchdarklydemos.com
          
  notify-completion:
    runs-on: ubuntu-latest
    needs: [authorize, delete-demo-environment]
    if: ${{ always() && needs.authorize.result == 'success' && inputs.webhook_url != '' && inputs.webhook_id != '' }}
    steps:
      - name: Notify Workflow Completed
        env:
          WEBHOOK_ID: ${{ inputs.webhook_id }}
          DEMO_USER: ${{ inputs.name }}
          RESULT: ${{ needs.delete-demo-environment.result }}
        run: |
          WEBHOOK_URL=$(jq -r '.inputs.webhook_url' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$WEBHOOK_URL"
          echo "Notifying webhook of delete workflow completion..."

          if [ "$RESULT" == "success" ]; then CONCLUSION="success"; else CONCLUSION="failure"; fi

          BODY=$(jq -cn --arg run_id "$GITHUB_RUN_ID" --arg webhook_id "$WEBHOOK_ID" --arg conclusion "$CONCLUSION" \
            --arg email_prefix "$DEMO_USER" --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{event: "workflow_completed", run_id: $run_id, workflow_type: "delete", status: "completed",
              conclusion: $conclusion, webhook_id: $webhook_id, email_prefix: $email_prefix, timestamp: $timestamp}')
          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions" \
            -d "$BODY" || echo "Webhook notification failed"
