# =============================================================================
# ServiceAccount for EKS Pod Identity
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ld-demo-togglewear-sa
  # No annotation needed - Pod Identity Association handles IAM role binding

---
# =============================================================================
# Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ld-demo-togglewear-deployment
  labels:
    app: ld-demo-togglewear
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ld-demo-togglewear
  template:
    metadata:
      labels:
        app: ld-demo-togglewear
    spec:
      serviceAccountName: ld-demo-togglewear-sa
      containers:
        - name: ld-demo-togglewear
          image: placeholder4
          ports:
            - name: web
              containerPort: 3000
              protocol: TCP
          imagePullPolicy: IfNotPresent
          # Nothing the server reads is in the image. The keys come from the
          # Secret the workflow writes just before this is applied
          # (LD_SDK_KEY, LD_RESET_TOKEN, DEMO_API_SECRET); the rest is plain.
          envFrom:
            - secretRef:
                name: ld-demo-togglewear-secrets
          env:
            - name: LD_PROJECT_KEY
              value: placeholder-project
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}

---
# =============================================================================
# Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: placeholder1
spec:
  selector:
    app: ld-demo-togglewear
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP

---
# =============================================================================
# Ingress
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ld-demo-togglewear-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
spec:
  tls:
    - hosts:
        - placeholder2
      secretName: placeholder-tls-secret
  rules:
    - host: placeholder2
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: placeholder3
                port:
                  number: 80
